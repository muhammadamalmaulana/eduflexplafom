<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#techGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="180" r="160" fill="#06B6D4" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="580" cy="260" r="180" fill="#8B5CF6" opacity="0.15" filter="url(#glowFilter)" />

  <!-- Neural Network Connections -->
  <g stroke="url(#neonGlow)" stroke-width="2" opacity="0.45">
    <line x1="220" y1="140" x2="320" y2="200" />
    <line x1="220" y1="225" x2="320" y2="200" />
    <line x1="220" y1="310" x2="320" y2="250" />
    <line x1="320" y1="200" x2="400" y2="160" />
    <line x1="320" y1="200" x2="400" y2="225" />
    <line x1="320" y1="250" x2="400" y2="225" />
    <line x1="320" y1="250" x2="400" y2="290" />
    <line x1="400" y1="160" x2="480" y2="200" />
    <line x1="400" y1="225" x2="480" y2="200" />
    <line x1="400" y1="290" x2="480" y2="250" />
    <line x1="480" y1="200" x2="580" y2="225" />
    <line x1="480" y1="250" x2="580" y2="225" />
  </g>

  <!-- Central AI Chip Unit -->
  <rect x="340" y="165" width="120" height="120" rx="24" fill="#0F172A" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glowFilter)" />
  <rect x="360" y="185" width="80" height="80" rx="16" fill="url(#cyanPurple)" opacity="0.2" />

  <!-- AI Brain / Chip Nodes -->
  <g fill="#38BDF8">
    <circle cx="220" cy="140" r="8" filter="url(#glowFilter)"/>
    <circle cx="220" cy="225" r="8" filter="url(#glowFilter)"/>
    <circle cx="220" cy="310" r="8" filter="url(#glowFilter)"/>
    
    <circle cx="320" cy="200" r="9" fill="#A855F7" filter="url(#glowFilter)"/>
    <circle cx="320" cy="250" r="9" fill="#A855F7" filter="url(#glowFilter)"/>

    <circle cx="480" cy="200" r="9" fill="#A855F7" filter="url(#glowFilter)"/>
    <circle cx="480" cy="250" r="9" fill="#A855F7" filter="url(#glowFilter)"/>

    <circle cx="580" cy="225" r="12" fill="#38BDF8" filter="url(#glowFilter)"/>
  </g>

  <!-- Central Brain Microchip Icon -->
  <path d="M 385 205 L 415 205 M 385 225 L 415 225 M 385 245 L 415 245 M 400 190 L 400 260" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="400" cy="225" r="6" fill="#F43F5E" />

  <!-- Floating Data Vectors / Badges -->
  <rect x="70" y="55" width="170" height="38" rx="19" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" opacity="0.9"/>
  <text x="155" y="79" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ RAG &amp; VECTOR AI</text>

  <rect x="560" y="55" width="170" height="38" rx="19" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" opacity="0.9"/>
  <text x="645" y="79" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🧠 LLM PIPELINE</text>

  <!-- Title Bottom Ribbon -->
  <rect x="40" y="340" width="720" height="75" rx="18" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="375" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">AI Engineering: LLM &amp; RAG Architecture</text>
  <text x="70" y="399" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Autonomous Agents • ChromaDB • LangGraph • Prompt Engineering</text>
  <circle cx="715" cy="377" r="18" fill="#06B6D4" fill-opacity="0.2"/>
  <path d="M 710 371 L 722 377 L 710 383 Z" fill="#38BDF8"/>
</svg>

