<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1E38" />
      <stop offset="100%" stop-color="#31102A" />
    </linearGradient>
    <linearGradient id="laravelRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D20" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glowFs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgFs)" />

  <!-- Ambient Glows -->
  <circle cx="240" cy="190" r="160" fill="#06B6D4" opacity="0.12" filter="url(#glowFs)" />
  <circle cx="570" cy="210" r="160" fill="#FF2D20" opacity="0.14" filter="url(#glowFs)" />

  <!-- Code Editor Window Mockup -->
  <rect x="220" y="85" width="360" height="230" rx="16" fill="#090D16" stroke="#334155" stroke-width="2" filter="url(#glowFs)"/>
  
  <!-- Editor Bar -->
  <circle cx="245" cy="107" r="5" fill="#EF4444" />
  <circle cx="260" cy="107" r="5" fill="#F59E0B" />
  <circle cx="275" cy="107" r="5" fill="#10B981" />
  <rect x="310" y="101" width="130" height="12" rx="4" fill="#1E293B" />
  <text x="375" y="111" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">api-controller.php</text>

  <!-- Syntax Highlighting Lines -->
  <g font-family="monospace" font-size="12">
    <text x="245" y="145" fill="#F43F5E">&lt;?php</text>
    <text x="245" y="170" fill="#818CF8"><tspan fill="#38BDF8">class</tspan> CourseController <tspan fill="#38BDF8">extends</tspan> BaseController {</text>
    <text x="265" y="195" fill="#E2E8F0"><tspan fill="#F59E0B">public function</tspan> index() {</text>
    <text x="285" y="220" fill="#34D399"><tspan fill="#38BDF8">return</tspan> Response::json(Course::all());</text>
    <text x="265" y="245" fill="#E2E8F0">}</text>
    <text x="245" y="270" fill="#818CF8">}</text>
  </g>

  <!-- Floating Logos/Emblems -->
  <!-- Next.js pill -->
  <g transform="translate(140, 150)">
    <circle cx="40" cy="40" r="32" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
    <text x="40" y="47" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="22" text-anchor="middle">N</text>
  </g>

  <!-- Laravel pill -->
  <g transform="translate(600, 150)">
    <circle cx="40" cy="40" r="32" fill="url(#laravelRed)" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="40" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="20" text-anchor="middle">L11</text>
  </g>

  <!-- Badges -->
  <rect x="70" y="55" width="170" height="38" rx="19" fill="#1E293B" stroke="#000" stroke-width="1.5" opacity="0.9"/>
  <text x="155" y="79" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ NEXT.JS 15</text>

  <rect x="560" y="55" width="170" height="38" rx="19" fill="#1E293B" stroke="#FF2D20" stroke-width="1.5" opacity="0.9"/>
  <text x="645" y="79" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔥 LARAVEL 11 API</text>

  <!-- Title Bottom Ribbon -->
  <rect x="40" y="340" width="720" height="75" rx="18" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="375" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Modern Fullstack: Next.js 15, Laravel 11 &amp; Tailwind</text>
  <text x="70" y="399" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Fullstack Web App • Sanctum Auth • Eloquent ORM • Tailwind CSS • MySQL</text>
  <circle cx="715" cy="377" r="18" fill="#FF2D20" fill-opacity="0.2"/>
  <path d="M 710 371 L 722 377 L 710 383 Z" fill="#FB7185"/>
</svg>

